name: flow_lyrix
description: An app for loading mp3 files and display the lyrics within those mp3 files based on timestamps.
publish_to: "none"
version: 0.13.2

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  receive_sharing_intent:
    #  ^1.8.1
    git:
      url: https://github.com/KasemJaffer/receive_sharing_intent.git
      ref: 2cea396843cd3ab1b5ec4334be4233864637874e

  # christian_lyrics:
  #   git:
  #     url: https://github.com/Movinghead333/christian_lyrics.git
  #     ref: 35ed17a888b5f2b442e829a9d1921be917cd27f9
  christian_lyrics:
    path: C:/Dev/flutter_projects/forks/christian_lyrics

  sylt_parser:
    git:
      url: https://github.com/Movinghead333/sylt_parser.git
      ref: 4b5d94b099a88f96661ab793b01222cad4805268
  # sylt_parser:
  #   path: C:/Dev/dart_projects/sylt_parser

  # Use for provider based app-state management
  provider: ^6.0.5

  path_provider: ^2.1.5

  # Used for BehaviourSubjects
  rxdart: ^0.27.7

  audio_session: ^0.2.3
  audio_service: ^0.18.18
  just_audio: ^0.10.5

  flutter_colorpicker: ^1.1.0

  get_storage: ^2.1.1

  # Used for reading audio meta data like album and title of a song.
  flutter_media_metadata:
    git:
      url: https://github.com/ms-biztech/flutter_media_metadata.git
      ref: 8d780176dd36ae659f329d593a45111d4a7bffc0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
